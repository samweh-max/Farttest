.brand { font-family:'D-DIN','DIN Alternate','Bahnschrift','DIN 1451 Std',system-ui,sans-serif; line-height:1.05; }
.searchrow { display:flex; gap:10px; align-items:stretch; margin-bottom:14px; }
.search { flex:1; position:relative; display:block; margin:0; min-width:0; }
.search input[type=text] { padding-left:2.6rem; }
.search::before { content:''; position:absolute; left:.85rem; top:50%; width:1.05rem; height:1.05rem; transform:translateY(-50%); pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23788596' stroke-width='2.4' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") no-repeat center / contain; }
.searchrow button { flex:none; white-space:nowrap; }
.sec > summary { display:flex; align-items:center; gap:8px; cursor:pointer; list-style:none; font-size:1.05rem; font-weight:700; }
.sec > summary::-webkit-details-marker { display:none; }
.sec > summary::before { content:'▸'; color:var(--accent); }
.sec[open] > summary::before { content:'▾'; }
.sec-name { flex:1; }
.sec-btns { display:flex; gap:6px; }
.tc-link { display:block; color:inherit; text-decoration:none; }
.trial-card .mv { display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
.trial-card .mv select { width:auto; min-height:36px; flex:1; }
.brand.sm { flex:none; margin-left:auto; text-align:right; }
.brand.sm b { font-size:1.05rem; letter-spacing:.06em; }
.brand.sm span { font-size:.5rem; max-width:5.3rem; margin-left:auto; line-height:1.1; letter-spacing:.02em; }
@media (max-width:379px) { .brand.sm span { display:none; } }
.brand b { display:block; font-weight:700; font-size:1.5rem; letter-spacing:.06em; }
.brand span { display:block; font-weight:400; font-size:.72rem; letter-spacing:.03em; color:var(--muted); white-space:normal; }
:root {
  --bg:#f3f6fa; --card:#ffffff; --ink:#18212d; --muted:#586577; --line:#d8e0ea;
  --accent:#0072CE; --accent-ink:#ffffff; --accent-soft:#e0eefa;
  --warn:#9a5a12; --warn-soft:#fdeed9; --bad:#b3261e; --bad-soft:#fbe3e0;
  --ok:#1e8a4c; --ok-soft:#e6f5ec; --utc-bg:#e2e8f0; --utc-line:#c4cdd9;
  --radius:12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#10151c; --card:#19212b; --ink:#e5ebf3; --muted:#98a5b6; --line:#2e3846;
    --accent:#4da3ea; --accent-ink:#06121f; --accent-soft:#132c45;
    --warn:#e8a95f; --warn-soft:#3a2a15; --bad:#f28b81; --bad-soft:#3d1d1a;
    --ok:#5cc98a; --ok-soft:#12301f; --utc-bg:#1f2a37; --utc-line:#3b4a5c;
  }
}
/* sunlight mode: black on white, heavy borders */
:root[data-contrast] { --bg:#ffffff; --card:#ffffff; --ink:#000000; --muted:#26313d; --line:#59636f; --accent:#00448a; --accent-ink:#ffffff; --accent-soft:#cfe3f7; --warn:#6b3200; --warn-soft:#ffe0ad; --bad:#9b0000; --bad-soft:#ffd0d0; --ok:#0b6b36; --ok-soft:#d4f0dc; --utc-bg:#d5dbe3; --utc-line:#8d99a8; color-scheme:light; }
:root[data-contrast] input, :root[data-contrast] select, :root[data-contrast] textarea { border:2px solid #000; background:#fff; color:#000; }
:root[data-contrast] .btn, :root[data-contrast] button { border-width:2px; border-color:#000; }
:root[data-contrast] .card { border:2px solid #59636f; }
:root[data-contrast] body { font-weight:500; }
:root[data-contrast] .entry-field input { font-weight:800; font-size:1.6rem; }
:root[data-contrast] .plot-no { font-size:1.9rem; }
.warnbox { background:var(--warn-soft) !important; border-color:var(--warn) !important; }
.rovalue { min-height:50px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-weight:700; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:0 10px; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
a { color:var(--accent); }
h1,h2,h3 { line-height:1.2; margin:0 0 .5rem; }
h1 { font-size:1.35rem; } h2 { font-size:1.15rem; } h3 { font-size:1rem; }
p { margin:.25rem 0 .75rem; }
.top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:.75rem; padding:.7rem 16px; background:var(--card); border-bottom:1px solid var(--line); }
.top h1 { margin:0; flex:1; font-size:1.15rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top .back { text-decoration:none; font-weight:600; white-space:nowrap; }
.top .spacer { flex:1; }
.top .back { overflow:hidden; text-overflow:ellipsis; min-width:0; }

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="kbbar" aria-label="Move between boxes">
  <button type="button" data-d="left" tabindex="-1" aria-label="Previous">◀</button>
  <button type="button" data-d="up" tabindex="-1" aria-label="Up">▲</button>
  <button type="button" data-d="down" tabindex="-1" aria-label="Down">▼</button>
  <button type="button" data-d="right" tabindex="-1" aria-label="Next">▶</button>
  <button type="button" data-d="done" class="done" tabindex="-1">Done</button>

<script>
'use strict';
const APP_VERSION = 26; // keep in step with VERSION in sw.js
/* ---------- storage ---------- */
const KEY = 'fieldAssessments.v1';
const app = document.getElementById('app');
let db = loadDB();
let homeQuery = ''; // the text in the home page search box
function applyContrast() { document.documentElement.toggleAttribute('data-contrast', !!db.settings.contrast); }
applyContrast();

function migrateDb(d) { // keeps older data and backups working
  d.trials.forEach(t => {
    if (t.crop) t.crop = t.crop.replace('(BRSNN)', '(BRSNW)');
    t.trialId = String(t.trialId || '').toUpperCase();
    (t.assessments || []).forEach(a => { if (a.assessor) a.assessor = String(a.assessor).toUpperCase(); });
    (t.assessments || []).forEach(a => (a.types || []).forEach(ty => { if (ty.sizeL !== undefined) { if (ty.sizeH === undefined) ty.sizeH = ty.sizeL; delete ty.sizeL; } }));
  });
  if (d.settings && d.settings.assessor) d.settings.assessor = String(d.settings.assessor).toUpperCase();
  d.drafts = d.drafts || {}; d.signatures = d.signatures || {};
  if (d.settings && !d.settings.deviceId) d.settings.deviceId = 'dev' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); // runs before uid() exists
  return d;
}
function loadDB() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) { const d = JSON.parse(s); d.trials = d.trials || []; d.sections = d.sections || []; d.settings = d.settings || {}; const m = migrateDb(d);
      m.trials.forEach(t => (t.assessments || []).forEach(a => { if (!a.device) a.device = m.settings.deviceId; })); // made on this device before signatures existed
      try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {} return m; }
  } catch (e) {}
  return migrateDb({ trials: [], sections: [], settings: { showTrt: false } });
}
/* unsaved forms (new / edited trials and assessment dates) are kept here on every change, so nothing is lost if the app closes */
const draftKey = { trial: id => 'trial:' + (id || 'new'), assess: (tid, aid) => `assess:${tid}:${aid || 'new'}` };
const getDraft = k => (db.drafts || {})[k];
function saveDraft(k, obj) { db.drafts[k] = { ...JSON.parse(JSON.stringify(obj)), _saved: Date.now() }; save(); }

const savedAgo = ts => { const m = Math.round((Date.now() - ts) / 6e4); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };
/* signatures: drawn once per device; each assessment remembers the signature of the device it was done on */
const deviceSig = () => db.signatures[db.settings.signatureId] || null;
function sigFor(a) {
  if (a.sigId) return db.signatures[a.sigId] || null;
  return (!a.device || a.device === db.settings.deviceId) ? deviceSig() : null; // older assessments from this device
}
function stampAssessment(a) { // records which device (and signature) did this assessment
  let changed = false;
  if (!a.device) { a.device = db.settings.deviceId; changed = true; }
  if (!a.sigId && a.device === db.settings.deviceId && db.settings.signatureId) { a.sigId = db.settings.signatureId; changed = true; }
  return changed;
}
function doBackup() {
  db.trials.forEach(tr => tr.assessments.forEach(stampAssessment)); // so each assessment carries this device's signature to other devices
  const ts = Date.now(), json = JSON.stringify(db, null, 1);
  db.settings.lastBackup = ts; db.trials.forEach(tr => tr.assessments.forEach(x => { x.backedUpAt = ts; })); save();
  download(new Blob([json], { type: 'application/json' }), `field-assessments-backup_${dmy(today()).replace(/\//g, '-')}.json`);
  toast('Backup saved');
}
const secOpts = sel => `<option value="">None (Other trials)</option>${db.sections.map(sc => `<option value="${sc.id}" ${sel === sc.id ? 'selected' : ''}>${esc(sc.name)}</option>`).join('')}`;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { toast('Could not save on this device. Export a backup now.'); return false; }
}

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
function num(s) {

  if (s === '') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
const round = (n, d = 2) => n == null ? null : Math.round(n * 10 ** d) / 10 ** d;
const fmt = (n, d = 2) => n == null ? '–' : String(round(n, d));
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;

  const m = /^\s*(\d{1,2})[\/.\-\s](\d{1,2})[\/.\-\s](\d{2}|\d{4})\s*$/.exec(str || ''); if (!m) return '';
  const y = m[3].length === 2 ? 2000 + +m[3] : +m[3], mo = +m[2], da = +m[1], dt = new Date(y, mo - 1, da);

const range = n => Array.from({ length: n }, (_, i) => i + 1);
let toastTimer;

const go = h => { location.hash = h; };
const goReplace = h => { location.replace(h); };

/* ---------- lists: trial types, assessment menus, crops, weeds ---------- */
const TRIAL_TYPES = ['Fungicide', 'Herbicide', 'Biostimulant', 'SAT (Seed Applied Treatment)', 'BioFungicide', 'Insecticide', 'Growth Regulator (PGR)'];
const FUNG_PESTS = [
  ['Wheat', [['SEPTTR', 'Septoria'], ['PUCCST', 'Yellow Rust'], ['PUCCRT', 'Brown Rust'], ['ERYSGR', 'Powdery Mildew'], ['FUSASP', 'Fusarium']]],
  ['Barley', [['RHYNSE', 'Rhynchosporium'], ['PYRNTE', 'Net Blotch'], ['RAMUCC', 'Ramularia'], ['PUCCHD', 'Brown Rust'], ['ERYSGH', 'Powdery Mildew']]],

// scrolls a box into the middle of the visible area only when it is hidden or under the keyboard (avoids needless jumps)

/* ---------- arrow bar above the keyboard (keeps the keyboard open while moving between boxes) ---------- */

/* ---------- assessment model ---------- */

        <span class="small muted">${t.assessments.length} assessment${t.assessments.length === 1 ? '' : 's'}</span><button class="small" data-unarch="${t.id}">Unarchive</button></div>`).join('')}</details>` : ''}
    <section class="card subtle" style="margin-top:24px">
      <p id="offline-status" class="small"></p>
      <p id="app-ver" class="small muted"></p>
      <h3>Backup &amp; Move Between Devices</h3>
      <p class="small muted">All data is saved in this browser on this device. Export a backup regularly, and use Restore to load it on another device.</p>
      <label class="chk small" style="margin-bottom:12px"><input type="checkbox" id="contrast" ${db.settings.contrast ? 'checked' : ''}> ☀ Sunlight mode (high contrast, easier to read outdoors)</label>
      <label class="chk small" style="margin-bottom:12px"><input type="checkbox" id="arrowbar" ${db.settings.arrowBar ? 'checked' : ''}> Show my own ◀ ▲ ▼ ▶ bar above the keyboard <span class="muted" style="font-weight:400">(iPhone/iPad already have their own arrows above the keyboard; Android always shows mine)</span></label>
      <div class="actions">
        <button id="backup">Export Backup (.json)</button>
        <label class="btn">Restore Backup<input type="file" id="restore" accept=".json,application/json" hidden></label>
      </div>
    </section>
    <section class="card subtle" style="margin-top:16px">
      <h3>Signature</h3>
      <p class="small muted">Draw it once with your finger. It is added as <b>Signed:</b> at the top right of every page of the PDF and Excel files you export, for assessments done on this device. Assessments done on someone else's device keep their signature.</p>
      <p class="small ${deviceSig() ? 'rep-ok' : 'muted'}" style="margin-bottom:.6rem">${deviceSig() ? '✓ Signature saved on this device' : 'No signature yet'}</p>
      <button id="sig-edit" type="button">${deviceSig() ? 'Edit Signature' : 'Add Signature'}</button>
    </section>
  </main>`;
  document.getElementById('sig-edit').onclick = () => openSignaturePad(() => viewHome());
  const drd = document.getElementById('dr-discard');
  if (drd) drd.onclick = () => { if (!confirm('Discard the unfinished new trial?')) return; dropDraft(draftKey.trial(null)); viewHome(); };
  updateOfflineStatus(); showVersion();
  const q = document.getElementById('q');
  function applySearch() {
    const term = q ? q.value.trim().toLowerCase() : ''; homeQuery = q ? q.value : '';
    let shown = 0;
    app.querySelectorAll('[data-s]').forEach(el => { el.hidden = !!term && !el.dataset.s.includes(term); if (!el.hidden) shown++; });
    app.querySelectorAll('details.sec').forEach(dt => { const sc = db.sections.find(x => x.id === dt.dataset.sec); const vis = dt.querySelectorAll('[data-s]:not([hidden])').length; dt.hidden = !!term && vis === 0; dt.open = term ? true : !(sc && sc.collapsed); });
    const ab = document.getElementById('arch-box'); if (ab) { const vis = ab.querySelectorAll('[data-s]:not([hidden])').length; ab.hidden = !!term && vis === 0; if (term && vis) ab.open = true; }
    const oh = document.getElementById('other-h'), ol = document.getElementById('other-list');
    if (ol) { const vis = ol.querySelectorAll('[data-s]:not([hidden])').length; ol.hidden = !!term && vis === 0; if (oh) oh.hidden = ol.hidden; }
    const nm = document.getElementById('nomatch'); if (nm) nm.hidden = !(term && !shown);
  }
  if (q) { q.oninput = applySearch; applySearch(); }
  const ns = document.getElementById('new-sec');
  if (ns) ns.onclick = () => { const name = (prompt('Section name?') || '').trim(); if (!name) return; db.sections.push({ id: uid(), name }); save(); viewHome(); };
  app.querySelectorAll('[data-ren]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); const sc = db.sections.find(x => x.id === b.dataset.ren); const name = (prompt('Rename section', sc.name) || '').trim(); if (!name) return; sc.name = name; save(); viewHome(); });
  app.querySelectorAll('[data-delsec]').forEach(b => b.onclick = e => {
    e.preventDefault(); e.stopPropagation(); const sc = db.sections.find(x => x.id === b.dataset.delsec);
    if (!confirm(`Delete the section "${sc.name}"? Its trials are kept and move to "Other trials".`)) return;
    db.sections = db.sections.filter(x => x.id !== sc.id); db.trials.forEach(t => { if (t.section === sc.id) delete t.section; }); save(); viewHome();
  });
  app.querySelectorAll('details.sec').forEach(dt => dt.addEventListener('toggle', () => { if (q && q.value.trim()) return; const sc = db.sections.find(x => x.id === dt.dataset.sec); if (sc && !!sc.collapsed === dt.open) { sc.collapsed = !dt.open; save(); } }));
  app.querySelectorAll('[data-unarch]').forEach(b => b.onclick = () => { const t = getTrial(b.dataset.unarch); delete t.archived; t.updated = Date.now(); save(); toast('Trial moved back to your list'); viewHome(); });
  document.getElementById('arrowbar').onchange = e => { db.settings.arrowBar = e.target.checked; save(); };
  document.getElementById('backup').onclick = () => { doBackup(); viewHome(); };
  const bk = document.getElementById('bk-now'); if (bk) bk.onclick = () => { doBackup(); viewHome(); };
  document.getElementById('contrast').onchange = e => { db.settings.contrast = e.target.checked; applyContrast(); save(); };
  document.getElementById('restore').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!Array.isArray(d.trials)) throw new Error();
      if (!confirm(`Restore ${d.trials.length} trial(s) from backup? Trials already on this device with the same identity will be replaced; others are kept.`)) return;
      (d.sections || []).forEach(sec => { if (!db.sections.some(x => x.id === sec.id)) db.sections.push(sec); });
      Object.values(d.signatures || {}).forEach(sg => { if (sg && sg.id && !db.signatures[sg.id]) db.signatures[sg.id] = sg; }); // other people's signatures stay with their assessments
      d.trials.forEach(nt => { migrateDb({ trials: [nt] }); (nt.assessments || []).forEach(a => { if (!a.device) a.device = 'imported'; }); const i = db.trials.findIndex(t => t.id === nt.id); if (i >= 0) db.trials[i] = nt; else db.trials.push(nt); });
      save(); toast('Backup restored'); viewHome();
    } catch (err) { alert('That file is not a valid backup.'); }
  };
}

/* ---------- TRIAL FORM (add / edit + randomization) ---------- */
function viewTrialForm(trial) {
  const editing = !!trial;
  const locked = editing && trial.assessments.some(a => Object.keys(a.data).length);
  const dk = draftKey.trial(editing ? trial.id : null), draft = getDraft(dk);
  const d = draft ? JSON.parse(JSON.stringify(draft)) : editing ? JSON.parse(JSON.stringify(trial)) : {
    id: uid(), trialId: '', desc: '', type: '', crop: '', untreated: 0, reps: 4, trts: 6, numbering: 'rep', serpentine: false,
    apps: 0, trtApps: [], trtNames: [], layout: null, assessments: [], created: Date.now()
  };
  d.assessments = editing ? trial.assessments : []; // a draft only holds the trial set-up; assessment data always comes from the saved trial
  d.apps = d.apps || 0; d.trtApps = d.trtApps || [];
  if (!d.layout) d.layout = blankLayout(d.reps, d.trts);
  if (draft) setTimeout(() => toast('Your unsaved changes were restored'), 50);

  app.innerHTML = `
  <header class="top"><a class="back" href="${editing ? '#/trial/' + d.id : '#/'}">← Back</a><h1>${editing ? 'Edit Trial' : 'Add Trial'}</h1><div class="brand sm" aria-label="FART – Field Assessment Recording Tool"><b>FART</b><span>Field Assessment Recording Tool</span></div></header>
  <main>
    <div class="steps" id="steps">
      <button class="step" data-st="1" type="button"><b>1</b> Describe</button>
      <button class="step" data-st="2" type="button"><b>2</b> Treatments</button>
      <button class="step" data-st="3" type="button"><b>3</b> Plot Layout</button>
    </div>
    <p class="small muted" style="margin:-6px 0 12px">Saved automatically as you go – you can leave and carry on later.</p>
    <section class="card" data-step="1">
      <h2>Trial Details</h2>
      <div class="grid2">
        <label class="field"><span>Trial ID *</span><input id="f-id" value="${esc(d.trialId)}" placeholder="e.g. GB27X01010H-SMW01" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase"></label>
        <label class="field"><span>Description</span><input id="f-desc" value="${esc(d.desc)}" placeholder="Crop, site, protocol…"></label>
        <label class="field"><span>Trial type</span>
          <select id="f-type"><option value="">— Select —</option>${TRIAL_TYPES.map(x => `<option ${d.type === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
        <label class="field"><span>Crop</span>
          <select id="f-crop"><option value="">— Select —</option>
            ${CROPS.map(([g, items]) => `<optgroup label="${g}">${items.map(c => `<option value="${esc(cropLabel(c))}" ${d.crop === cropLabel(c) ? 'selected' : ''}>${esc(cropLabel(c))}</option>`).join('')}</optgroup>`).join('')}
            <option value="__other" ${d.crop && !isKnownCrop(d.crop) ? 'selected' : ''}>Other (type it in)…</option></select></label>
        <label class="field" id="crop-other-wrap" ${d.crop && !isKnownCrop(d.crop) ? '' : 'hidden'}><span>Other crop</span>
          <input id="f-crop-other" value="${esc(d.crop && !isKnownCrop(d.crop) ? d.crop : '')}" placeholder="Crop name (CODE)" autocomplete="off"></label>
        <label class="field"><span>Number of reps *</span><input id="f-reps" type="number" inputmode="numeric" min="1" max="50" value="${d.reps}" ${locked ? 'disabled' : ''}></label>
        <label class="field"><span>Number of treatments *</span><input id="f-trts" type="number" inputmode="numeric" min="1" max="200" value="${d.trts}" ${locked ? 'disabled' : ''}></label>
        <label class="field"><span>Plot numbering</span>
          <select id="f-num" ${locked ? 'disabled' : ''}>
            <option value="rep" ${d.numbering === 'rep' ? 'selected' : ''}>By rep: 101, 102… 201, 202…</option>
            <option value="seq" ${d.numbering === 'seq' ? 'selected' : ''}>Sequential: 1, 2, 3…</option>
          </select></label>
        <label class="field"><span>Walking order</span>
          <label class="chk" style="min-height:44px"><input type="checkbox" id="f-serp" ${d.serpentine ? 'checked' : ''}> Serpentine (reverse every other rep) – can also be switched while assessing</label></label>
      </div>
      ${locked ? `<p class="small muted">Reps, treatments and plot numbering are locked because this trial already has assessment data.</p>` : ''}
    </section>

    <section class="card" data-step="2">
      <h2>Applications</h2>
      <label class="field" style="max-width:260px"><span>How many applications?</span><input id="f-apps" type="number" inputmode="numeric" min="0" max="26" value="${d.apps || ''}" placeholder="e.g. 3"></label>
      <p class="small muted" id="apps-hint">Applications are labelled A, B, C… Under each treatment below, tap the applications it receives (a treatment can have several).</p>
    </section>
    <section class="card" data-step="2">
      <h2>Treatment Names <span class="muted small">(optional)</span></h2>
      <p class="small muted">Tick <b>Untreated</b> on the untreated check. Some assessments (e.g. crop counts) can be recorded on those plots only.</p>
      <div id="trt-names"></div>
    </section>

    <section class="card" data-step="3">
      <h2>Randomization</h2>
      <p class="small muted">Enter the treatment number for each plot from your protocol. The plot number is shown above each box. It jumps to the next box as you type, and ◀ ▲ ▼ ▶ move around. Each rep must contain every treatment once.</p>
      <div class="actions"><button id="r-clear" class="small">Clear All</button></div>
      <div id="rand"></div>
      <details style="margin-top:12px">
        <summary>Faster: Paste the Randomization (from Excel or a Protocol)</summary>
        <p class="small muted">Paste treatment numbers in plot order (one row per rep, or one long column), or two columns of <b>plot number</b> and <b>treatment</b>. Spaces, commas and tabs all work.</p>
        <textarea id="paste" placeholder="3 1 4 2 6 5&#10;2 5 1 6 3 4&#10;…"></textarea>
        <div class="actions"><button id="paste-go" class="small">Apply Pasted Randomization</button></div>
      </details>
    </section>

    <div class="actions">
      <button id="w-back" type="button">← Back</button>
      <button id="w-next" class="primary" type="button">Next →</button>
      <button id="save" class="primary">${editing ? 'Save Changes' : 'Create Trial'}</button>
      <button id="w-cancel" type="button">${editing ? 'Discard Changes' : 'Discard'}</button>
    </div>
    ${editing ? '' : `<p class="small muted">After creating the trial you open it, add an assessment date, then start assessing.</p>`}
  </main>`;

  let step = 1;
  function showStep(n) {
    step = n;
    app.querySelectorAll('[data-step]').forEach(sec => { sec.hidden = +sec.dataset.step !== n; });
    app.querySelectorAll('.step').forEach(b => b.classList.toggle('on', +b.dataset.st === n));
    document.getElementById('w-back').hidden = n === 1;
    document.getElementById('w-next').hidden = n === 3;
    document.getElementById('save').hidden = !(n === 3 || editing);
    window.scrollTo(0, 0);
  }

  const $ = id => document.getElementById(id);

  function drawNames() {
    if (d.untreated > d.trts) d.untreated = 0;
    const letters = appLetters(d.apps);
    d.trtApps = range(d.trts).map(k => (d.trtApps[k - 1] || []).filter(x => letters.includes(x)));
    $('apps-hint').hidden = !letters.length;
    $('trt-names').innerHTML = range(d.trts).map(k => `<div class="trt-block">
      <div class="trt-row"><label class="field" style="margin:0"><span>Trt ${k}</span><input data-k="${k}" value="${esc(d.trtNames[k - 1] || '')}" placeholder="${k === 1 ? 'e.g. Untreated check' : ''}"></label>
        <label class="chk"><input type="checkbox" data-u="${k}" ${d.untreated === k ? 'checked' : ''}> Untreated</label></div>
      ${letters.length && d.untreated !== k ? `<div class="app-chips"><span class="lbl">Applications</span>${letters.map(L => `<button type="button" class="chip ${d.trtApps[k - 1].includes(L) ? 'on' : ''}" data-app="${k}" data-l="${L}" aria-pressed="${d.trtApps[k - 1].includes(L)}">${L}</button>`).join('')}</div>` : ''}
    </div>`).join('');
    $('trt-names').querySelectorAll('input[data-k]').forEach(inp => inp.oninput = () => { d.trtNames[inp.dataset.k - 1] = inp.value; });
    $('trt-names').querySelectorAll('input[data-u]').forEach(cb => cb.onchange = () => {
      d.untreated = cb.checked ? +cb.dataset.u : 0;
      if (d.untreated) d.trtApps[d.untreated - 1] = []; // the untreated check receives no applications
      d.layout.forEach((_, r) => updateRow(r));
      drawNames(); persist();
    });
    $('trt-names').querySelectorAll('[data-app]').forEach(b => b.onclick = () => {
      const k = +b.dataset.app, L = b.dataset.l, arr = d.trtApps[k - 1];
      d.trtApps[k - 1] = arr.includes(L) ? arr.filter(x => x !== L) : [...arr, L].sort();
      b.classList.toggle('on', d.trtApps[k - 1].includes(L)); b.setAttribute('aria-pressed', d.trtApps[k - 1].includes(L));
      persist();
    });
  }
  // keeps an up-to-date copy of the form, so it survives leaving the page or closing the app
  function capture() {
    d.trialId = $('f-id').value.trim().toUpperCase(); d.desc = $('f-desc').value.trim(); d.type = $('f-type').value;
    d.crop = $('f-crop').value === '__other' ? $('f-crop-other').value.trim() : $('f-crop').value;
  }
  function persist() { capture(); const { assessments, ...setup } = d; saveDraft(dk, { ...setup, _step: step }); }
  function drawRand() {
    const tmp = { ...d };
    $('rand').innerHTML = `${kb.sentinel('prev', 1)}<div class="scroll"><table class="rand"><tbody>
      ${range(d.reps).reverse().map(rn => {
        const r = rn - 1, row = d.layout[r];
        const st = repStatus(row, d.trts);
        return `<tr><th class="l">Rep ${rn}</th>
          ${row.map((v, i) => `<td><div class="cell"><small>${plotNo(tmp, r, i)}</small>
            <input data-r="${r}" data-i="${i}" tabindex="${2 + r * d.trts + i}" value="${esc(v)}" inputmode="numeric" enterkeyhint="next" autocomplete="off"></div></td>`).join('')}
          <td class="l" id="st-${r}">${statusHtml(st)}</td></tr>`;
      }).join('')}
    </tbody></table></div>${kb.sentinel('next', 2 + d.reps * d.trts)}`;
    const boxes = [...$('rand').querySelectorAll('input:not(.sentinel)')];
    function move(dir) { // rep 1 is the bottom row, so "up" is the next rep
      const cur = document.activeElement; if (!cur || cur.dataset.r === undefined) return;
      let r = +cur.dataset.r, i = +cur.dataset.i;
      if (dir === 'right') { i++; if (i >= d.trts) { i = 0; r++; } }
      else if (dir === 'left') { i--; if (i < 0) { i = d.trts - 1; r--; } }
      else if (dir === 'up') r++;
      else r--;
      const n = $('rand').querySelector(`input[data-r="${r}"][data-i="${i}"]`); if (n) n.focus();
    }
    boxes.forEach(inp => {
      inp.oninput = () => {
        const r = +inp.dataset.r; d.layout[r][+inp.dataset.i] = inp.value.trim() === '' ? '' : Number(inp.value.trim()) || inp.value.trim();
        updateRow(r);
        const n = Number(inp.value.trim()); // jump on once the number can't get any longer (e.g. 3 of 6 treatments, 12 of 12)
        if (Number.isInteger(n) && n >= 1 && n <= d.trts && n * 10 > d.trts) move('right');
      };
      inp.onfocus = () => setTimeout(() => inp.select(), 0);
      inp.onkeydown = e => { if (kb.key(e)) return; if (e.key === 'Enter') { e.preventDefault(); move('right'); } };
    });
    $('rand').querySelector('[data-sent="prev"]').onfocus = () => boxes.find(b => b.dataset.r === '0' && b.dataset.i === '0').focus();
    $('rand').querySelector('[data-sent="next"]').onfocus = () => boxes.find(b => +b.dataset.r === d.reps - 1 && +b.dataset.i === d.trts - 1).focus();
    kb.use({ dirs: ['left', 'right', 'up', 'down'], go: move }, boxes);
    d.layout.forEach((_, r) => updateRow(r));
  }
  function statusHtml(st) {
    if (st.ok) return `<span class="rep-ok">✓</span>`;
    const msg = [];
    if (st.blanks) msg.push(`${st.blanks} blank`);
    if (st.bad) msg.push(`${st.bad} invalid`);
    if (st.missing.length && !st.blanks) msg.push(`missing ${st.missing.join(', ')}`);
    if (st.dup.length) msg.push(`repeated ${st.dup.join(', ')}`);
    return `<span class="rep-bad small">${msg.join('; ')}</span>`;
  }
  function updateRow(r) {
    const st = repStatus(d.layout[r], d.trts);
    $('st-' + r).innerHTML = statusHtml(st);
    const counts = {}; d.layout[r].forEach(v => counts[v] = (counts[v] || 0) + 1);
    $('rand').querySelectorAll(`input[data-r="${r}"]`).forEach(inp => {
      const v = d.layout[r][+inp.dataset.i]; const n = Number(v);
      inp.classList.toggle('utc', !!d.untreated && n === d.untreated);
      inp.classList.toggle('err', v === '' || !Number.isInteger(n) || n < 1 || n > d.trts || counts[v] > 1);
    });
  }
  function resize() {
    const reps = clamp(parseInt($('f-reps').value, 10) || 1, 1, 50);
    const trts = clamp(parseInt($('f-trts').value, 10) || 1, 1, 200);
    if (reps === d.reps && trts === d.trts) return;
    d.reps = reps; d.trts = trts;
    d.layout = blankLayout(reps, trts);
    drawNames(); drawRand(); persist();
    toast('Layout cleared – fill in the randomization');
  }
  $('f-apps').onchange = () => { const v = $('f-apps').value.trim(); d.apps = clamp(parseInt(v, 10) || 0, 0, 26); $('f-apps').value = d.apps || ''; drawNames(); persist(); };
  // every typed character or choice is saved straight away
  const mainEl = app.querySelector('main');
  mainEl.addEventListener('input', () => persist());
  mainEl.addEventListener('change', () => persist());
  $('f-crop').onchange = () => { const o = $('f-crop').value === '__other'; $('crop-other-wrap').hidden = !o; if (o) $('f-crop-other').focus(); };
  $('f-id').oninput = e => { const el = e.target, pos = el.selectionStart; el.value = el.value.toUpperCase(); try { el.setSelectionRange(pos, pos); } catch (err) {} };
  $('f-reps').onchange = resize; $('f-trts').onchange = resize;
  $('f-num').onchange = () => { d.numbering = $('f-num').value; drawRand(); };
  $('f-serp').onchange = () => { d.serpentine = $('f-serp').checked; };
  $('r-clear').onclick = () => { if (!confirm('Clear every plot in the randomization?')) return; d.layout = blankLayout(d.reps, d.trts); drawRand(); persist(); $('rand').querySelector('input:not(.sentinel)').focus(); };
  $('w-cancel').onclick = () => {
    if (!confirm(editing ? 'Discard your unsaved changes to this trial?' : 'Discard this new trial? What you have entered so far will be deleted.')) return;
    dropDraft(dk); go(editing ? '#/trial/' + d.id : '#/');
  };
  $('paste-go').onclick = () => {
    const N = d.reps * d.trts;
    const lines = $('paste').value.split(/\r?\n/).map(l => l.trim()).filter(l => l && /\d/.test(l));
    const nums = $('paste').value.split(/[\s,;]+/).filter(Boolean).map(Number);
    // Two columns per line (plot number, treatment) — e.g. copied from a protocol table
    const pairs = lines.map(l => l.split(/[\s,;]+/).filter(Boolean).map(Number));
    if (pairs.length === N && pairs.every(p => p.length === 2 && p.every(Number.isInteger))) {
      const map = new Map(pairs.map(([pl, k]) => [pl, k]));
      const missing = [];
      const lay = range(d.reps).map((_, r) => range(d.trts).map((_, i) => {
        const pl = plotNo(d, r, i); if (!map.has(pl)) missing.push(pl); return map.get(pl) ?? '';
      }));
      if (missing.length) { alert(`These plot numbers weren't in the pasted list: ${missing.slice(0, 10).join(', ')}${missing.length > 10 ? '…' : ''}. Check the plot numbering setting above.`); return; }
      d.layout = lay; drawRand(); persist(); toast('Randomization applied'); return;
    }
    if (nums.length !== N || nums.some(n => !Number.isInteger(n))) {
      alert(`Expected ${N} treatment numbers (${d.reps} reps × ${d.trts} treatments), or ${N} lines of "plot  treatment", but found ${nums.length} numbers.`); return;
    }
    d.layout = range(d.reps).map((_, r) => nums.slice(r * d.trts, (r + 1) * d.trts));
    drawRand(); persist(); toast('Randomization applied');
  };
  $('save').onclick = () => {
    capture();
    if (!d.trialId) { alert('Please enter a Trial ID.'); showStep(1); $('f-id').focus(); return; }
    if (d.apps) {
      const none = range(d.trts).filter(k => k !== d.untreated && !(d.trtApps[k - 1] || []).length);
      if (none.length && !confirm(`Treatment${none.length > 1 ? 's' : ''} ${none.join(', ')} ${none.length > 1 ? 'have' : 'has'} no application selected. Save anyway?`)) { showStep(2); return; }
    }

      const L = b.dataset.ap; d.apps = d.apps.includes(L) ? d.apps.filter(x => x !== L) : [...d.apps, L].sort(); drawApps(); persist();
    });
    if ($('ap-utc')) $('ap-utc').onchange = e => { d.appsUntreated = e.target.checked; drawApps(); persist(); };
  }
  // keeps an up-to-date copy of the form, so it survives leaving the page or closing the app
  let ready = false;
  function capture() {
    d._dateText = $('a-date').value; const pd = parseDmy(d._dateText); if (pd) d.date = pd;
    d.assessor = $('a-who').value.trim().toUpperCase(); d.notes = $('a-notes').value.trim();
    d.cropBBCH = $('a-bbch').value.trim(); d.cropBBCHMin = $('a-bbch-min').value.trim(); d.cropBBCHMax = $('a-bbch-max').value.trim();
  }
  function persist() { if (!ready) return; capture(); const { data, ...rest } = d; saveDraft(dk, { ...rest, _step: step }); }
  app.querySelector('main').addEventListener('input', () => persist());
  app.querySelector('main').addEventListener('change', () => persist());
  $('w-cancel').onclick = () => {
    if (!confirm(editing ? 'Discard your unsaved changes to this date?' : 'Discard this new assessment date? What you have entered so far will be deleted.')) return;
    dropDraft(dk); go(back);
  };
  function goStep(n) {
    if (n === 2) {
      if (!parseDmy($('a-date').value)) { alert('Please enter the date as DD/MM/YYYY.'); $('a-date').focus(); return; }
      if (Array.isArray(d.apps) && !d.apps.length) { alert('Tap the applications to assess, or choose Assess All Applications.'); return; }
      if (!$('a-bbch').value.trim()) { alert('Please enter the crop growth stage (BBCH) – the majority value.'); $('a-bbch').focus(); return; }
    }
    showStep(n);
  }
  app.querySelectorAll('.step').forEach(b => b.onclick = () => goStep(+b.dataset.st));
  $('w-next').onclick = () => goStep(2);
  $('w-back').onclick = () => goStep(1);

  const sugg = [...seen.values()];
  const forThis = MENU_FOR[t.type] || [];
  let menuKey = forThis[0] || 'common';
  const getMenu = () => MENUS.find(m => m.key === menuKey);
  const menuOpt = k => `<option value="${k}" ${k === menuKey ? 'selected' : ''}>${esc(MENUS.find(m => m.key === k).label)}</option>`;
  const mine = ['common', ...forThis, 'custom'], others = MENUS.map(m => m.key).filter(k => !mine.includes(k));
  $('a-menu').innerHTML = t.type
    ? `<optgroup label="${esc(t.type)} trial">${mine.map(menuOpt).join('')}</optgroup><optgroup label="Other menus">${others.map(menuOpt).join('')}</optgroup>`
    : mine.concat(others).map(menuOpt).join('');

  const subsVal = () => Math.max(1, Math.min(50, parseInt($('b-subs').value, 10) || 1));
  const blankType = () => ({ id: uid(), name: '', unit: '', min: '', max: '', target: '', kind: '', leaf: '', stage: '', stageMin: '', stageMax: '', sizeH: '', sizeW: '', sizeUnit: 'cm', stageMode: '', stageOther: false, subs: subsVal(), untreatedOnly: false, noPhyto: false, phyto: false });
  const mkType = (it, extra) => ({ ...blankType(), name: it.n, unit: it.u || '', min: it.min ?? '', max: it.max ?? '', untreatedOnly: !!it.untr || (!!$('b-untr') && $('b-untr').checked), phyto: !!it.phyto, ...extra });
  function addIfNew(nt) {
    if (d.types.some(x => typeLabel(x).toLowerCase() === typeLabel(nt).toLowerCase())) return false;
    if (needsStage(nt)) { const o = d.types.find(x => x.target === nt.target && x.kind === nt.kind); if (o) STAGE_FIELDS.forEach(f => { nt[f] = o[f] || ''; }); }
    d.types.push(nt); return true;
  }
  function removeType(i) {
    const ty = d.types[i];
    const hasData = Object.values(d.data).some(r => (r[ty.id] !== undefined && r[ty.id] !== '') || r['_s_' + ty.id]);
    if (hasData && !confirm(`"${typeLabel(ty)}" has data recorded. Remove it and its data?`)) return false;
    d.types.splice(i, 1); return true;
  }

  /* describe: select assessments (several allowed), weeds/pests and leaf levels, then Add */
  let sel = new Set(), picked = [], leaves = [];
  function drawMenu() {
    const m = getMenu();
    ['menu-items', 'sel-hint', 'bld', 'std-add'].forEach(id => { $(id).hidden = !!m.custom; });
    $('custom-box').hidden = !m.custom;
    $('menu-items').innerHTML = m.items.map((it, i) => `<button class="chip ${sel.has(i) ? 'on' : ''}" data-m="${i}" type="button">${sel.has(i) ? '✓ ' : ''}${esc(it.label || it.n)}</button>`).join('');
    $('menu-items').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const i = +b.dataset.m; if (sel.has(i)) sel.delete(i); else sel.add(i); drawMenu(); });
  }
  function orderedGroups(m) {
    let g = m.groups || [];
    if (m.key === 'fungicide') { const c = (t.crop || '').match(/\(([A-Z]+)\)/); const code = c ? c[1] : ''; const first = code.startsWith('TRZA') ? 'Wheat' : code.startsWith('HORV') ? 'Barley' : code.startsWith('BRSN') ? 'OSR' : ''; g = [...g].sort((x, y) => (y[0] === first) - (x[0] === first)); }
    return g;
  }
  function drawPicked() {
    const kind = getMenu().target;
    $('b-picked').innerHTML = picked.length
      ? picked.map((c, i) => `<button class="chip on" data-p="${i}" title="Remove" type="button">${esc(c)} ✕</button>`).join('')
      : `<span class="small muted">No ${kind === 'weed' ? 'weeds' : 'pests'} chosen yet</span>`;
    $('b-picked').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { picked.splice(+b.dataset.p, 1); drawPicked(); });
  }
  const addPick = v => { v = (v || '').trim(); if (v && !picked.includes(v)) { picked.push(v); drawPicked(); } };
  function drawBuilder() {
    const m = getMenu();
    if (!m.target) { $('bld').innerHTML = ''; return; }
    const kind = m.target, word = kind === 'weed' ? 'weed' : 'pest / disease';
    const hasLeaf = m.items.some(it => it.leaf);
    const groups = orderedGroups(m);
    $('bld').innerHTML = `<div class="stagebox" style="padding-bottom:10px">
      <b>${kind === 'weed' ? 'Weeds' : 'Pests / diseases'}</b>
      <p class="small muted" style="margin:.2rem 0 .6rem">Needed for the ${kind === 'weed' ? 'weed' : 'pest'} assessments. Choose one or more.</p>
      ${groups.length ? `<label class="field"><span>${kind === 'weed' ? 'Weed' : 'Pest / disease'}</span><select id="b-sel"><option value="">— Select to add —</option>
        ${groups.map(([g, items]) => `<optgroup label="${g}">${items.map(([c, n]) => `<option value="${c}">${c} (${esc(n)})</option>`).join('')}</optgroup>`).join('')}</select></label>` : ''}
      <label class="field"><span>${groups.length ? 'Or type your own' : 'Type a ' + word}</span>
        <span style="display:flex;gap:8px"><input id="b-txt" placeholder="Code or name" autocomplete="off" autocapitalize="characters"><button id="b-add" class="small" type="button">Add</button></span></label>
      <div id="b-picked" class="chips" style="margin-bottom:12px"></div>
      ${hasLeaf ? `<b class="small">Leaf level(s)</b><div class="chips" id="b-leaves" style="margin:6px 0 4px">${LEAVES.map(l => `<button class="chip ${leaves.includes(l) ? 'on' : ''}" data-l="${l}" type="button">${l}</button>`).join('')}</div>` : ''}
    </div>`;
    drawPicked();
    if ($('b-sel')) $('b-sel').onchange = () => { addPick($('b-sel').value); $('b-sel').value = ''; };
    $('b-add').onclick = () => { addPick($('b-txt').value); $('b-txt').value = ''; };
    $('b-txt').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('b-add').click(); } };
    $('bld').querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
      const l = b.dataset.l; leaves = leaves.includes(l) ? leaves.filter(x => x !== l) : [...leaves, l].sort((x, y) => LEAVES.indexOf(x) - LEAVES.indexOf(y));
      b.classList.toggle('on', leaves.includes(l));
    });
  }
  $('add-custom').onclick = () => {
    const name = $('c-name').value.trim();
    if (!name) { toast('Give the custom assessment a name'); $('c-name').focus(); return; }
    const sb = Math.max(1, Math.min(50, parseInt($('c-subs').value, 10) || 1));
    const ok = addIfNew({ ...blankType(), name, unit: $('c-unit').value.trim(), min: $('c-min').value.trim(), max: $('c-max').value.trim(), subs: sb, untreatedOnly: $('c-untr').checked });
    if (!ok) { toast('Already added'); return; }
    ['c-name', 'c-unit', 'c-min', 'c-max'].forEach(id => { $(id).value = ''; }); $('c-untr').checked = false; $('c-subs').value = 1;
    drawTypes(); toast('Custom assessment added');
  };
  $('a-menu').onchange = () => { menuKey = $('a-menu').value; sel = new Set(); picked = []; leaves = []; drawMenu(); drawBuilder(); };
  $('b-subs').onchange = () => { $('b-subs').value = subsVal(); };

  $('add-assess').onclick = () => {
    const m = getMenu(), kind = m.target, word = kind === 'weed' ? 'weed' : 'pest';
    if ($('b-txt') && $('b-txt').value.trim()) { addPick($('b-txt').value); $('b-txt').value = ''; }
    const items = [...sel].sort((x, y) => x - y).map(i => m.items[i]);
    if (!items.length) { toast('Choose an assessment first'); return; }
    for (const it of items) {
      if (it.tg && !picked.length) { toast(`Choose a ${word} first`); return; }
      if (it.leaf && !leaves.length) { toast('Choose a leaf level first'); return; }
    }
    let n = 0;
    items.forEach(it => (it.tg ? picked : ['']).forEach(tg => (it.leaf ? leaves : ['']).forEach(l => { if (addIfNew(mkType(it, { target: tg, kind: tg ? kind : '', needStage: !!tg && !m.noStage, stageMode: (tg && m.stageMode) || '', leaf: l }))) n++; })));
    sel = new Set(); picked = []; leaves = []; $('b-untr').checked = false; // start fresh for the next assessment
    drawMenu(); drawBuilder(); drawTypes();
    toast(n ? `Added ${n} assessment${n > 1 ? 's' : ''}` : 'Already added');
  };

  /* Added Assessments: one separate card each */
  function cardHtml(ty, i) {
    const weed = ty.kind === 'weed', word = weed ? 'Weed' : 'Pest';
    const inp = (f, label, ph) => `<label class="field"><span>${label}</span><input data-i="${i}" data-f="${f}" inputmode="decimal" value="${esc(ty[f] || '')}" placeholder="${ph || ''}" autocomplete="off"></label>`;
    return `<div class="acard">
      <div class="ahead"><span class="anum">${i + 1}</span>
        <div class="atitle"><b>${esc(ty.name || 'New assessment')}</b>${ty.target ? `<span class="pill">${esc(ty.target)}</span>` : ''}${ty.leaf ? `<span class="pill">${esc(ty.leaf)}</span>` : ''}${ty.untreatedOnly ? `<span class="pill warn">Untreated plots only</span>` : ''}${ty.noPhyto ? `<span class="pill">No phyto</span>` : ''}</div>
        <button class="small danger" data-rm="${i}" title="Remove" aria-label="Remove" type="button">✕</button></div>
      ${needsStage(ty) && ty.stageMode === 'code' ? pestCodeBox(ty, i) : ''}
      ${needsStage(ty) && ty.stageMode !== 'code' ? `<div class="stagebox"><b class="small">${word} growth stage</b>
        <div class="grid3" style="margin-top:6px">${inp('stage', 'Majority *')}${inp('stageMin', 'Minimum')}${inp('stageMax', 'Maximum')}</div>
        ${weed ? `<div class="arow"><b class="small">Weed size</b><label class="small" style="display:flex;align-items:center;gap:6px">Unit
          <select data-i="${i}" data-f="sizeUnit" style="width:auto;min-height:34px">${['cm', 'mm'].map(u => `<option ${(ty.sizeUnit || 'cm') === u ? 'selected' : ''}>${u}</option>`).join('')}</select></label></div>
          <div class="grid2" style="margin-top:6px">${inp('sizeH', 'Height')}${inp('sizeW', 'Width')}</div>` : ''}</div>` : ''}
      ${isHeight(ty) ? `<label class="field" style="max-width:220px"><span>Height unit</span><select data-i="${i}" data-f="unit">${[...new Set(['mm', 'cm', ty.unit].filter(Boolean))].map(u => `<option ${ty.unit === u ? 'selected' : ''}>${u}</option>`).join('')}</select></label>` : ''}
      <label class="chk" style="margin-bottom:.9rem"><input type="checkbox" data-i="${i}" data-c="untreatedOnly" ${ty.untreatedOnly ? 'checked' : ''}> Record on untreated plots only</label>
      ${isPhyto(ty) ? `<label class="chk" style="margin-bottom:.9rem"><input type="checkbox" data-i="${i}" data-c="noPhyto" ${ty.noPhyto ? 'checked' : ''}> No phyto (fills 0 on every plot)</label>` : ''}
      <details ${ty.name ? '' : 'open'}><summary>Name, Unit, Range, Subsamples</summary>
        <div class="type-row" style="margin-top:8px">
          <label class="tname"><span>Name</span><input data-i="${i}" data-f="name" value="${esc(ty.name)}" placeholder="Type an assessment name"></label>
          ${isHeight(ty) ? `<label><span>Unit</span><input disabled value="${esc(ty.unit)} (set above)"></label>` : `<label><span>Unit</span><input data-i="${i}" data-f="unit" value="${esc(ty.unit)}" placeholder="%, cm, 0–9"></label>`}
          <label><span>Min</span><input data-i="${i}" data-f="min" value="${esc(ty.min)}" inputmode="decimal"></label>
          <label><span>Max</span><input data-i="${i}" data-f="max" value="${esc(ty.max)}" inputmode="decimal"></label>
          <label><span>Subsamples</span><input data-i="${i}" data-f="subs" value="${subsOf(ty)}" inputmode="numeric"></label>
        </div>
      </details>
    </div>`;
  }
  function drawTypes() {
    const n = d.types.length;
    const weeds = new Set(d.types.filter(x => x.kind === 'weed').map(x => x.target)).size, pests = new Set(d.types.filter(x => x.kind === 'pest').map(x => x.target)).size;
    $('sum').textContent = n ? `${n} assessment${n > 1 ? 's' : ''} added${weeds ? ` · ${weeds} weed${weeds > 1 ? 's' : ''}` : ''}${pests ? ` · ${pests} pest${pests > 1 ? 's' : ''}` : ''}` : '';
    $('types').innerHTML = d.types.map(cardHtml).join('') || `<p class="muted">Nothing added yet. Describe an assessment above and tap <b>+ Add assessment</b>.</p>`;
    $('types').querySelectorAll('input[data-f],select[data-f]').forEach(inp => inp.oninput = () => {
      const i = +inp.dataset.i, f = inp.dataset.f, ty = d.types[i]; ty[f] = inp.value;
      if (STAGE_FIELDS.includes(f) && needsStage(ty)) d.types.forEach((o, j) => { if (j !== i && o.target === ty.target && o.kind === ty.kind) { o[f] = inp.value; const el = $('types').querySelector(`input[data-i="${j}"][data-f="${f}"]`); if (el) el.value = inp.value; } });
    });
    $('types').querySelectorAll('input[data-c]').forEach(cb => cb.onchange = () => { d.types[+cb.dataset.i][cb.dataset.c] = cb.checked; drawTypes(); });
    $('types').querySelectorAll('select[data-pp]').forEach(sel => sel.onchange = () => {
      const i = +sel.dataset.pp, ty = d.types[i], other = sel.value === '__other', stage = other ? '' : sel.value;
      d.types.forEach(o => { if (o.target === ty.target && o.kind === ty.kind) { o.stage = stage; o.stageOther = other; } });
      drawTypes(); if (other) { const el = $('types').querySelector(`input[data-i="${i}"][data-f="stage"]`); if (el) el.focus(); }
    });
    $('types').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (removeType(+b.dataset.rm)) drawTypes(); });
    persist();
  }
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const s = sugg[b.dataset.s];
    addIfNew({ ...blankType(), name: s.name, unit: s.unit || '', min: s.min ?? '', max: s.max ?? '', target: s.target || '', kind: s.kind || '', needStage: s.needStage, phyto: !!s.phyto, leaf: s.leaf || '', untreatedOnly: !!s.untreatedOnly });
    drawTypes();
  });

  function commit(startAfter) {
    capture(); d.date = parseDmy($('a-date').value);
    if (!d.date) { showStep(1); alert('Please enter the date as DD/MM/YYYY.'); $('a-date').focus(); return; }
    if (Array.isArray(d.apps) && !d.apps.length) { showStep(1); alert('Tap the applications to assess, or choose Assess All Applications.'); return; }
    if (!d.cropBBCH) { showStep(1); alert('Please enter the crop growth stage (BBCH) – the majority value.'); $('a-bbch').focus(); return; }
    const tr = v => String(v ?? '').trim();
    d.types = d.types.map(ty => ({ ...ty, name: tr(ty.name), unit: tr(ty.unit), min: tr(ty.min), max: tr(ty.max), stage: tr(ty.stage), stageMin: tr(ty.stageMin), stageMax: tr(ty.stageMax), sizeH: tr(ty.sizeH), sizeW: tr(ty.sizeW), subs: subsOf(ty) })).filter(ty => ty.name);
    if (startAfter && !d.types.length) { showStep(2); alert('Add at least one assessment first.'); return; }
    const noStage = d.types.filter(ty => needsStage(ty) && !ty.stage);
    if (noStage.length) {
      showStep(2); drawTypes();
      alert('Please choose or enter the growth stage for: ' + [...new Set(noStage.map(ty => ty.target))].join(', '));
      const el = $('types').querySelector(`input[data-i="${d.types.indexOf(noStage[0])}"][data-f="stage"]`) || $('types').querySelector(`select[data-pp="${d.types.indexOf(noStage[0])}"]`); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
      return;
    }
    const names = d.types.map(ty => typeLabel(ty).toLowerCase());
    if (new Set(names).size !== names.length) { showStep(2); alert('Two assessments have the same name and unit. Please make them distinct.'); return; }
    if (t.type === 'Herbicide' && t.untreated && d.types.length && !d.types.some(ty => ty.kind === 'weed' && /count/i.test(ty.name)) // any weed count (general or untreated) means no reminder
      && !confirm('Are you sure you do not require a Untreated Weed Count for this assessment date?')) { showStep(2); return; }
    // drop data for removed assessments
    const ids = new Set(d.types.map(ty => ty.id));
    Object.values(d.data).forEach(r => Object.keys(r).forEach(k => { const base = k.startsWith('_s_') ? k.slice(3) : k; if (k !== '_note' && k !== '_na' && !ids.has(base)) delete r[k]; }));
    db.settings.assessor = d.assessor;
    delete d._dateText; delete d._step; delete d._saved;
    if (!d.apps || !d.apps.length) { d.apps = null; delete d.appsUntreated; }
    stampAssessment(d);
    const i = t.assessments.findIndex(x => x.id === d.id);
    if (i >= 0) t.assessments[i] = d; else t.assessments.push(d);
    delete db.drafts[dk]; t.updated = Date.now(); save();
    if (startAfter) go(`#/trial/${t.id}/a/${d.id}/plot/${firstIncomplete(t, d)}`);
    else { toast('Saved'); go(`#/trial/${t.id}`); }
  }
  $('a-start').onclick = () => commit(true);
  $('a-save').onclick = () => commit(false);
  drawMenu(); drawBuilder(); drawTypes(); drawApps(); ready = true; showStep(step);
}

/* ---------- DATA ENTRY (one plot per page) ---------- */
function viewEntry(t, a, idx, focusAt, keepScroll) {
  const order = walkOrder(t, a);
  idx = clamp(idx, 0, order.length - 1);
  const p = order[idx];
  const last = order.length - 1;
  const done = countDone(t, a);
  const show = !!db.settings.showTrt;
  const rec = a.data[p.plot] || {};
  const base = `#/trial/${t.id}/a/${a.id}`;
  const hintOf = ty => (ty.min !== '' || ty.max !== '') ? `${ty.min !== '' ? ty.min : '…'} to ${ty.max !== '' ? ty.max : '…'}` : ''; // range only; the unit is shown beside the box

  const na = isNA(a, p.plot), locked = !!a.locked;
  const fieldHtml = (ty, i) => {
    if (ty.untreatedOnly) return ''; // untreated counts are entered at the end in Review, so the untreated plots aren't revealed
    if (ty.noPhyto) return `<div class="nophyto">${esc(typeTitle(ty))}: No phyto (0 on every plot)</div>`;
    const hint = hintOf(ty), n = subsOf(ty);
    if (locked) { const v = n > 1 ? ((rec['_s_' + ty.id] || []).filter(x => x !== '').join(' / ')) : val(a, p.plot, ty.id); return `<div class="field entry-field"><span style="display:block;font-weight:600;margin-bottom:.3rem">${esc(typeTitle(ty))}</span><div class="rovalue">${esc(v || '–')}${v && ty.unit ? ' ' + esc(ty.unit) : ''}</div></div>`; }
    if (na) return '';
    if (n > 1) {
      const arr = rec['_s_' + ty.id] || [];
      return `<div class="field entry-field"><span style="display:block;font-weight:600;margin-bottom:.3rem">${esc(typeTitle(ty))}${ty.unit ? ` <b style="color:var(--accent)">${esc(ty.unit)}</b>` : ''} <span class="hint">(${esc(hint ? hint + ' · ' : '')}${n} subsamples)</span></span>
        <div class="subgrid">${range(n).map(k => `<input class="ev" data-t="${ty.id}" data-i="${i}" data-k="${k - 1}" value="${esc(arr[k - 1] ?? '')}" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="Subsample ${k}" placeholder="${k}">`).join('')}</div>
        <div class="small muted" style="margin-top:4px;text-align:center">Mean: <b id="mean-${i}">${esc(rec[ty.id] ?? '–')}</b></div></div>`;
    }
    return `<label class="field entry-field"><span>${esc(typeTitle(ty))} ${hint ? `<span class="hint">(${esc(hint)})</span>` : ''}</span>
      <div class="inwrap"><input class="ev" data-t="${ty.id}" data-i="${i}" value="${esc(rec[ty.id] ?? '')}" inputmode="decimal" enterkeyhint="next" autocomplete="off">${ty.unit ? `<span class="sfx">${esc(ty.unit)}</span>` : ''}</div></label>`;
  };

  const shellHtml = `
  <div class="shell" id="shell">
  <header class="top"><a class="back" href="#/trial/${t.id}">← ${esc(t.trialId)}</a><span class="spacer"></span>
    <a class="btn small" href="${base}/review">Review</a><div class="brand sm" aria-label="FART – Field Assessment Recording Tool"><b>FART</b><span>Field Assessment Recording Tool</span></div></header>
  <main class="entry">
    <div class="bar"><div style="width:${done / order.length * 100}%"></div></div>
    <div class="small muted"><b>${esc(dmy(a.date))}</b> · ${done} of ${order.length} plots complete · page ${idx + 1} of ${order.length}</div>

    <section class="card plot-card" style="margin-top:8px">
      <span class="plot-no">Plot ${p.plot}</span>
      <span class="plot-meta">Rep <b>${p.rep}</b>${show ? ` · <b>${esc(trtLabel(t, p.trt))}</b>` : ''}</span>
      <span id="badge" class="done-badge"></span>
    </section>

    <form id="ef" onsubmit="return false" autocomplete="off">
    ${kb.sentinel('prev')}
    <section class="card">
      ${locked ? '<div class="nophyto">🔒 This date is locked. Unlock it from the trial page or Review to edit.</div>' : ''}${na && !locked ? '<div class="nophyto">Plot not assessed – recorded as NA</div>' : ''}
      ${a.types.map(fieldHtml).join('')}
      ${kb.sentinel('next')}
      <label class="field" style="margin-bottom:0"><span>Plot note <span class="hint muted" style="font-weight:400">(optional – tap to add)</span></span>
        <input id="note" tabindex="-1" ${locked ? 'disabled' : ''} value="${esc(rec._note || '')}" enterkeyhint="done" autocomplete="off"></label>
    </section>
    </form>

    <div class="actions" style="justify-content:space-between;align-items:center">
      <label class="small" style="display:flex;gap:.5rem;align-items:center">Go to
        <select id="jump" style="width:auto;min-height:36px">${order.map((q, j) =>
          `<option value="${j}" ${j === idx ? 'selected' : ''}>${q.plot} · Rep ${q.rep}${plotComplete(t, a, q.plot) ? ' ✓' : plotStarted(a, q.plot) ? ' …' : ''}</option>`).join('')}</select></label>
      <span style="display:flex;gap:14px;flex-wrap:wrap">
        ${locked ? '' : `<label class="chk small"><input type="checkbox" id="na" ${na ? 'checked' : ''}> Plot not assessed</label>`}
        <label class="chk small"><input type="checkbox" id="sun" ${db.settings.contrast ? 'checked' : ''}> ☀ High contrast</label>
        <label class="chk small"><input type="checkbox" id="serp" ${(a.serpentine !== undefined ? a.serpentine : t.serpentine) ? 'checked' : ''}> Serpentine</label>
        <label class="chk small"><input type="checkbox" id="showTrt" ${show ? 'checked' : ''}> Show treatment</label>
      </span>
    </div>

  </main>
  <div class="navbtns">
    <button id="prev" ${idx === 0 ? 'disabled' : ''}>← Back</button>
    <button id="next" class="primary">Next →</button>
  </div>
  </div>`;
  // Moving plot to plot: swap the contents inside the existing screen frame (keeps its size and scroll), so the page doesn't flicker
  const oldShell = keepScroll != null && document.getElementById('shell');
  if (oldShell) { const tmp = document.createElement('div'); tmp.innerHTML = shellHtml; oldShell.replaceChildren(...tmp.firstElementChild.childNodes); }
  else app.innerHTML = shellHtml;
  if (keepScroll != null) { const me = app.querySelector('main.entry'); if (me) me.scrollTop = keepScroll; }

  const inputs = [...app.querySelectorAll('input.ev')];
  const note = document.getElementById('note');
  function check() {
    inputs.forEach(inp => {
      const ty = a.types[inp.dataset.i]; const s = outOfRange(ty, inp.value.trim());
      inp.classList.toggle('bad', s === 'bad'); inp.classList.toggle('warn', s === 'warn');
    });
    document.getElementById('badge').innerHTML = plotComplete(t, a, p.plot) ? `<span class="pill ok">✓ complete</span>` : '';
  }
  const rowFor = () => a.data[p.plot] || (a.data[p.plot] = {});
  const tidy = () => { if (a.data[p.plot] && !Object.keys(a.data[p.plot]).length) delete a.data[p.plot]; stampAssessment(a); t.updated = Date.now(); save(); check(); };
  function store(key, v) {
    v = v.trim(); const r = rowFor();
    if (v === '') delete r[key]; else r[key] = v;
    tidy();
  }
  function storeSub(inp) {
    const ty = a.types[inp.dataset.i];
    const m = setSubValue(a, p.plot, ty, +inp.dataset.k, inp.value);
    const el = document.getElementById('mean-' + inp.dataset.i); if (el) el.textContent = m ?? '–';
    tidy();
  }
  const fields = inputs; // the notes box is outside the Next / arrow sequence
  const kbOpen = () => fields.includes(document.activeElement) || document.activeElement === note;
  // Draw the next plot in place (no hash change event) and refocus, so the keyboard stays open.
  function goPlot(to, at) {
    history.replaceState(null, '', `${base}/plot/${to}`);
    const me = app.querySelector('main.entry');
    viewEntry(t, a, to, at, me ? me.scrollTop : 0);
  }
  function warnRange() { if (inputs.some(inp => outOfRange(a.types[inp.dataset.i], inp.value.trim()) === 'bad')) toast('A value is outside its expected range'); }
  function nextPlot(at) {
    warnRange();
    if (idx === last) go(`${base}/review`); else goPlot(idx + 1, at);
  }
  function prevPlot(at) { if (idx > 0) goPlot(idx - 1, at); }
  function step(dir) {
    if (document.activeElement === note) { if (dir === 'down' || dir === 'right') nextPlot(0); else if (fields.length) fields[fields.length - 1].focus(); return; }
    if (!fields.length) { if (dir === 'down' || dir === 'right') nextPlot(undefined); else prevPlot(undefined); return; }
    const f = Math.max(fields.indexOf(document.activeElement), 0);
    if (dir === 'down') { if (f < fields.length - 1) fields[f + 1].focus(); else nextPlot(0); }
    else if (dir === 'up') { if (f > 0) fields[f - 1].focus(); else prevPlot(fields.length - 1); }
    else if (dir === 'right') nextPlot(f);
    else if (dir === 'left') prevPlot(f);
  }
  inputs.forEach(inp => {
    inp.oninput = () => inp.dataset.k !== undefined ? storeSub(inp) : store(inp.dataset.t, inp.value);
    inp.onfocus = () => setTimeout(() => inp.select(), 0);
    inp.onkeydown = e => { if (kb.key(e)) return; if (e.key === 'Enter') { e.preventDefault(); step('down'); } };
  });
  note.oninput = () => store('_note', note.value);
  note.onkeydown = e => { if (kb.key(e)) return; if (e.key === 'Enter') { e.preventDefault(); note.blur(); } };
  kb.use({ dirs: ['left', 'right', 'up', 'down'], go: step }, [...fields, note]);
  // The phone's own Previous / Next arrows run through hidden boxes before and after, so they carry on across plots
  app.querySelector('[data-sent="prev"]').onfocus = () => { if (idx > 0) prevPlot(fields.length - 1); else if (fields.length) fields[0].focus(); };
  app.querySelector('[data-sent="next"]').onfocus = () => { if (idx < last) nextPlot(0); else if (fields.length) fields[fields.length - 1].focus(); };
  // Next goes through the assessments on this plot first, then on to the next plot. Back does the reverse.
  const nextBtn = document.getElementById('next');
  const nextText = () => { const f = fields.indexOf(document.activeElement); return (f === fields.length - 1 || document.activeElement === note) ? (idx === last ? 'Finish → Review' : 'Next Plot →') : 'Next →'; };
  const setNext = () => { nextBtn.textContent = nextText(); };
  fields.forEach(f => f.addEventListener('focus', setNext)); note.addEventListener('focus', setNext);
  // bring the box you move to into the middle of the visible area, clear of the keyboard
  [...fields, note].forEach(el => el.addEventListener('focus', () => { setTimeout(() => ensureVisible(el), 60); setTimeout(() => { if (document.activeElement === el) ensureVisible(el); }, 380); }));
  ['prev', 'next'].forEach(id => document.getElementById(id).addEventListener('mousedown', e => e.preventDefault()));
  nextBtn.onclick = () => { if (fields.includes(document.activeElement) || document.activeElement === note) step('down'); else if (fields.length) fields[0].focus(); else nextPlot(undefined); };
  document.getElementById('prev').onclick = () => { if (fields.includes(document.activeElement)) step('up'); else if (document.activeElement === note) step('up'); else prevPlot(undefined); };
  document.getElementById('jump').onchange = e => goReplace(`${base}/plot/${e.target.value}`);
  const naBox = document.getElementById('na');
  if (naBox) naBox.onchange = e => {
    const r = rowFor();
    if (e.target.checked) {
      if (Object.keys(r).some(k => k !== '_note' && k !== '_na') && !confirm('Clear the values recorded for this plot and mark it as not assessed?')) { e.target.checked = false; return; }
      Object.keys(r).forEach(k => { if (k !== '_note') delete r[k]; }); r._na = true;
    } else delete r._na;
    if (!Object.keys(r).length) delete a.data[p.plot];
    t.updated = Date.now(); save(); viewEntry(t, a, idx);
  };
  document.getElementById('sun').onchange = e => { db.settings.contrast = e.target.checked; applyContrast(); save(); };
  document.getElementById('serp').onchange = e => { // switch walking order part-way through; stay on this plot
    a.serpentine = e.target.checked; t.updated = Date.now(); save();
    goPlot(walkOrder(t, a).findIndex(q => q.plot === p.plot), undefined);
    toast(a.serpentine ? 'Serpentine walk on' : 'Walking in plot order');
  };
  document.getElementById('showTrt').onchange = e => { db.settings.showTrt = e.target.checked; save(); viewEntry(t, a, idx); };
  kb.shell(document.getElementById('shell'));
  check();
  if (focusAt != null && fields.length) fields[Math.min(focusAt, fields.length - 1)].focus({ preventScroll: keepScroll != null });
  else { const firstEmpty = inputs.find(inp => inp.value === '') || null; if (firstEmpty && matchMedia('(pointer:fine)').matches) firstEmpty.focus(); }
}

/* ---------- box plot (SVG) ---------- */
function quantile(sorted, q) { const pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos); return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo); }
function boxPlotSvg(t, a, ty, sel) { // sel = { plot, t } highlights one point
  const st = typeStats(t, a, ty);
  const cols = range(t.trts).filter(k => applies(t, ty, k, a)).map(k => { const vals = st.groups[k].vals.filter(v => v.n != null); return { k, vals, v: vals.map(x => x.n).sort((x, y) => x - y) }; });
  const all = cols.flatMap(c => c.v);
  const title = `<h3 style="margin:16px 0 4px">${esc(typeLabel(ty))}</h3>`;
  if (!all.length) return `<div class="bp">${title}<p class="small muted">No values yet.</p></div>`;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const colW = 46, L = 44, T = 10, B = 34, H = 210;
  const W = L + cols.length * colW + 8, plotH = H - T - B;
  const y = v => T + plotH - (v - lo) / (hi - lo) * plotH;
  const nice = v => String(round(v, Math.abs(hi - lo) < 5 ? 2 : Math.abs(hi - lo) < 50 ? 1 : 0));
  let g = ty.unit ? `<text x="4" y="9">${esc(ty.unit)}</text>` : '', pts = '', picked = null;
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${nice(v)}</text>`; }
  cols.forEach((c, i) => {
    const cx = L + colW * i + colW / 2, bw = 24;
    g += `<text x="${cx}" y="${H - 14}" text-anchor="middle">T${c.k}${c.k === t.untreated ? '·UTC' : ''}</text>`;
    if (!c.v.length) return;
    const q1 = quantile(c.v, .25), med = quantile(c.v, .5), q3 = quantile(c.v, .75), mn = c.v[0], mx = c.v[c.v.length - 1];
    g += `<line x1="${cx}" x2="${cx}" y1="${y(mn)}" y2="${y(mx)}" stroke="var(--accent)" stroke-width="1.5"/>
      <line x1="${cx - 7}" x2="${cx + 7}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--accent)" stroke-width="1.5"/><line x1="${cx - 7}" x2="${cx + 7}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--accent)" stroke-width="1.5"/>
      <rect x="${cx - bw / 2}" y="${y(q3)}" width="${bw}" height="${Math.max(1, y(q1) - y(q3))}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" rx="2"/>
      <line x1="${cx - bw / 2}" x2="${cx + bw / 2}" y1="${y(med)}" y2="${y(med)}" stroke="var(--accent)" stroke-width="3"/>`;
    c.vals.forEach((v, j) => { // points are spread sideways a little so each can be tapped
      const px = cx + (j - (c.vals.length - 1) / 2) * 6, isSel = !!sel && sel.t === ty.id && String(sel.plot) === String(v.plot);
      if (isSel) picked = v;
      pts += `<circle class="pt${isSel ? ' sel' : ''}" cx="${px}" cy="${y(v.n)}" r="${isSel ? 5.5 : 3}"/><circle class="hit" cx="${px}" cy="${y(v.n)}" r="10" fill="transparent" data-plot="${v.plot}" data-t="${ty.id}"/>`;
    });
  });
  const info = picked ? `<b>Plot ${picked.plot}</b> · Rep ${picked.rep} · Trt ${picked.trt}${trtName(t, picked.trt) ? ' ' + esc(trtName(t, picked.trt)) : ''} · value <b>${esc(picked.raw)}</b> · <a href="#" data-goto>show in table</a>` : 'Tap a point to see which plot it is.';
  return `<div class="bp">${title}<div class="scroll" style="border:0"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 300)}px;max-width:${W * 1.6}px" role="img" aria-label="Box plot of ${esc(typeLabel(ty))} by treatment">${g}${pts}</svg></div><div class="small bp-info">${info}</div></div>`;
}

/* ---------- REVIEW (raw data only) ---------- */
// A rep is flagged when it is far from the other reps of its treatment: more than OUTLIER_RATIO times
// bigger or smaller than their median, AND further away than OUTLIER_FLOOR of the scale of the assessment
// (the min–max range if one is set, otherwise the biggest value recorded). So 5 vs 8 is fine; 20 vs 60 and 5 vs 45 are flagged.
const OUTLIER_RATIO = 2, OUTLIER_FLOOR = 0.15;
const medianOf = arr => { const v = arr.slice().sort((x, y) => x - y), m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
function viewReview(t, a) {
  const n = nPlots(t, a);
  const done = countDone(t, a);
  const order = walkOrder(t, a);
  const idxOf = plot => order.findIndex(q => q.plot === plot);
  const base = `#/trial/${t.id}/a/${a.id}`;
  const allPlots = plots(t);

  app.innerHTML = `
  <header class="top"><a class="back" href="#/trial/${t.id}">← ${esc(t.trialId)}</a><h1>Review · ${esc(dmy(a.date))}</h1><div class="brand sm" aria-label="FART – Field Assessment Recording Tool"><b>FART</b><span>Field Assessment Recording Tool</span></div></header>
  <main>
    <p class="small muted">${done} of ${n} plots complete${t.apps ? ` · ${esc(scopeText(a))}` : ''}. These are the raw values, grouped by treatment. Edit any value directly; tap a plot number to open that plot.</p>
    <div class="actions" style="align-items:center">
      <a class="btn" href="${base}/plot/${firstIncomplete(t, a)}">← Back to Plots</a>
      <button id="xl" class="primary">Export…</button>
      <span style="flex:1"></span>
      <button id="lock" class="ibtn ${a.locked ? 'on' : ''}" title="${a.locked ? 'Locked – tap to unlock' : 'Lock this date'}" aria-label="${a.locked ? 'Unlock this date' : 'Lock this date'}">${a.locked ? ICON.lock : ICON.unlock}</button>
    </div>
    ${a.locked ? '<section class="card warnbox"><b>🔒 Locked.</b> Values cannot be changed until you unlock this date.</section>' : ''}
    <div class="legend" style="margin-bottom:12px"><span><i class="sw miss"></i>Missing</span><span><i class="sw out"></i>Out of range, not a number, or a rep that is far from the others in its treatment</span></div>
    <section class="card" id="issues"></section>
    <section class="card"><div class="arow"><div><h2 style="margin:0">Box Plots</h2><span class="small muted">Spread of the reps for each treatment, one chart per assessment.</span></div>
      <button id="bp-toggle" class="small">Show Box Plots</button></div><div id="bp"></div></section>
    ${a.types.map(ty => `
      <section class="card rv">
        <h2>${esc(typeLabel(ty))}${ty.untreatedOnly ? ' <span class="pill warn">Untreated plots only – enter here</span>' : ''}</h2>
        <div class="scroll"><table class="review"><thead><tr>
          <th class="l">Trt</th>${range(t.reps).map(r => `<th>Rep ${r}</th>`).join('')}
        </tr></thead><tbody>
          ${range(t.trts).filter(k => applies(t, ty, k, a)).map(k => `<tr class="${k === t.untreated ? 'utc' : ''}"><td class="l"><b>${k}</b>${k === t.untreated ? ' <span class="muted small">(UTC)</span>' : ''}${trtName(t, k) ? `<span class="tn">${esc(trtName(t, k))}</span>` : ''}</td>
            ${range(t.reps).map(r => {
              const pl = allPlots.find(q => q.rep === r && q.trt === k);
              if (!pl) return `<td class="muted">—</td>`;
              const nsub = ty.noPhyto ? 1 : subsOf(ty);
              if (nsub > 1) { const arr = (a.data[pl.plot] && a.data[pl.plot]['_s_' + ty.id]) || [];
                return `<td class="v" data-plot="${pl.plot}" data-t="${ty.id}"><div>${range(nsub).map(q => `<input class="sb" ${a.locked ? 'disabled' : ''} data-k="${q - 1}" value="${esc(arr[q - 1] ?? '')}" inputmode="decimal" aria-label="Plot ${pl.plot} subsample ${q}">`).join('')}</div>
                  <a href="${base}/plot/${idxOf(pl.plot)}">${pl.plot}</a></td>`; }
              return `<td class="v" data-plot="${pl.plot}" data-t="${ty.id}"><input ${a.locked ? 'disabled' : ''} value="${esc(val(a, pl.plot, ty.id))}" inputmode="decimal" aria-label="Plot ${pl.plot}">
                <a href="${base}/plot/${idxOf(pl.plot)}">${pl.plot}</a></td>`;
            }).join('')}</tr>`).join('')}
        </tbody></table></div>
      </section>`).join('')}
    ${Object.entries(a.data).some(([, r]) => r._note) ? `<section class="card"><h2>Plot Notes</h2><ul>${
      Object.entries(a.data).filter(([, r]) => r._note).sort((x, y) => x[0] - y[0]).map(([pl, r]) => `<li><a href="${base}/plot/${idxOf(+pl)}">Plot ${pl}</a>: ${esc(r._note)}</li>`).join('')}</ul></section>` : ''}
  </main>`;

  let bpOn = false;
  function drawBoxPlots() {
    const el = document.getElementById('bp'); if (!bpOn) { el.innerHTML = ''; applySel(); return; }
    el.innerHTML = a.types.map(ty => boxPlotSvg(t, a, ty, selPt)).join('');
    applySel();
  }
  let selPt = null; // the point tapped on a box plot
  function applySel() { // highlight that plot's treatment row and cell in the table
    app.querySelectorAll('tr.hl').forEach(r => r.classList.remove('hl'));
    app.querySelectorAll('td.v.sel').forEach(c => c.classList.remove('sel'));
    if (!selPt || !bpOn) return;
    const td = app.querySelector(`td.v[data-plot="${selPt.plot}"][data-t="${selPt.t}"]`);
    if (td) { td.classList.add('sel'); td.closest('tr').classList.add('hl'); }
  }
  document.getElementById('bp').onclick = e => {
    if (e.target.closest('[data-goto]')) { e.preventDefault(); const row = app.querySelector('tr.hl'); if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    const c = e.target.closest('circle[data-plot]'); if (!c) return;
    selPt = selPt && String(selPt.plot) === c.dataset.plot && selPt.t === c.dataset.t ? null : { plot: c.dataset.plot, t: c.dataset.t };
    drawBoxPlots();
  };
  document.getElementById('bp-toggle').onclick = () => { bpOn = !bpOn; if (!bpOn) selPt = null; document.getElementById('bp-toggle').textContent = bpOn ? 'Hide Box Plots' : 'Show Box Plots'; drawBoxPlots(); };
  function refresh() {
    drawBoxPlots();
    const missing = new Set(), flagged = [], spreadKeys = new Set();
    const link = pl => `<a href="${base}/plot/${idxOf(pl)}">${pl}</a>`;
    a.types.forEach(ty => {
      const grp = range(t.trts).filter(k => applies(t, ty, k, a)).map(k => ({ k, vs: allPlots.filter(p => p.trt === k).map(p => ({ plot: p.plot, n: num(val(a, p.plot, ty.id)) })).filter(v => v.n != null) }));
      const every = grp.flatMap(g => g.vs.map(v => Math.abs(v.n)));
      const bounded = ty.min !== '' && ty.max !== '' && Number(ty.max) > Number(ty.min);
      const floor = OUTLIER_FLOOR * (bounded ? Number(ty.max) - Number(ty.min) : Math.max(0, ...every));
      grp.forEach(({ k, vs }) => {
        if (vs.length < 2) return;
        const far = vs.filter(v => { // with 3+ reps compare with the group median, so one wild value can't drag its neighbours along
          const m = vs.length === 2 ? vs.find(o => o !== v).n : medianOf(vs.map(o => o.n)), dev = Math.abs(v.n - m), lo = Math.min(Math.abs(v.n), Math.abs(m)), hi = Math.max(Math.abs(v.n), Math.abs(m));
          return dev > floor && (lo === 0 || hi / lo > OUTLIER_RATIO);
        });
        if (!far.length) return;
        far.forEach(v => spreadKeys.add(`${v.plot}|${ty.id}`));
        const rest = vs.filter(o => !far.includes(o)).map(o => o.n);
        flagged.push({ ty, html: vs.length === 2 ? `Trt ${k}: plot ${link(vs[0].plot)} = ${vs[0].n} and plot ${link(vs[1].plot)} = ${vs[1].n} are far apart`
          : `Trt ${k}: ${far.map(v => `plot ${link(v.plot)} = ${v.n}`).join(', ')} – ${rest.length ? `far from the other reps (${rest.join(', ')})` : 'the reps are very spread out'}` });
      });
    });
    a.types.forEach(ty => allPlots.forEach(p => {
      if (!applies(t, ty, p.trt, a)) return;
      const td = app.querySelector(`td.v[data-plot="${p.plot}"][data-t="${ty.id}"]`); if (!td) return;
      const raw = val(a, p.plot, ty.id), rng = outOfRange(ty, raw);
      td.classList.toggle('miss', raw === '');
      td.classList.toggle('out', rng !== '' || spreadKeys.has(`${p.plot}|${ty.id}`));
      if (raw === '') missing.add(p.plot);
      else if (rng) flagged.push({ ty, html: `plot ${link(p.plot)} = ${esc(raw)} (${rng === 'warn' ? 'not a number' : 'out of range'})` });
    }));
    const miss = [...missing].sort((x, y) => x - y);
    document.getElementById('issues').innerHTML = (!miss.length && !flagged.length)
      ? `<b class="rep-ok">✓ No missing or flagged values.</b>`
      : `<h3>Check These</h3><ul class="issues small">
          ${miss.length ? `<li><b>Missing data</b> in ${miss.length} plot${miss.length > 1 ? 's' : ''}: ${miss.map(pl => `<a href="${base}/plot/${idxOf(pl)}">${pl}</a>`).join(', ')}</li>` : ''}
          ${flagged.map(f => `<li><b>${esc(typeTitle(f.ty))}</b> · ${f.html}</li>`).join('')}
        </ul>`;
  }
  app.querySelectorAll('td.v input.sb').forEach(inp => {
    inp.onchange = () => {
      const td = inp.closest('td'), ty = a.types.find(x => x.id === td.dataset.t);
      setSubValue(a, td.dataset.plot, ty, +inp.dataset.k, inp.value);
      t.updated = Date.now(); save(); refresh();
    };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } };
  });
  app.querySelectorAll('td.v input:not(.sb)').forEach(inp => {
    inp.onchange = () => {
      const td = inp.closest('td'); const plot = td.dataset.plot; const v = inp.value.trim();
      const r = a.data[plot] || (a.data[plot] = {});
      if (v === '') delete r[td.dataset.t]; else r[td.dataset.t] = v;
      if (!Object.keys(r).length) delete a.data[plot];
      t.updated = Date.now(); save(); refresh();
    };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } };
  });
  document.getElementById('xl').onclick = () => openExport(t, a);
  document.getElementById('lock').onclick = () => { toggleLock(t, a); viewReview(t, a); };
  refresh();
}

/* raw columns for exports: assessments with subsamples get one column per subsample, no averages */
function expandCols(as) {
  const cols = [];

function downloadMany(files) {

      return;
    }

}

function download(blob, name) {

    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
